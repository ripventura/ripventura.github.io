{%- assign r = site.data.resume -%}
<section class="tile tile--hero" style="--i: 0">
  <div class="hero-heading">
    <img class="avatar" src="{{ "/assets/img/avatar.png" | relative_url }}" alt="Memoji of {{ r.name }}" width="120" height="120">
    <div>
      <h1>{{ r.name }}</h1>
      <p class="hero-title">{{ r.title }}</p>
    </div>
  </div>
  <p class="hero-tagline">{{ r.tagline }}</p>
  <div class="actions">
    <a class="button button--primary" href="{{ site.resume_path | relative_url }}" download>{% include icon.html name="download" %} Resume PDF</a>
    <a class="button" href="mailto:{{ site.email }}">{% include icon.html name="mail" %} Email me</a>
  </div>
</section>
