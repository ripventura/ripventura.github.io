<script>
  // Show the current local time in the location tile.
  document.querySelectorAll(".local-time").forEach((el) => {
    const fmt = new Intl.DateTimeFormat("en", { hour: "numeric", minute: "2-digit", timeZone: el.dataset.tz, timeZoneName: "short" });
    const tick = () => { el.textContent = fmt.format(new Date()); };
    tick();
    setInterval(tick, 30000);
  });
</script>
